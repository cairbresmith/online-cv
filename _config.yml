#Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: Cairbre Smith
tagline: IT Enterprise Architect and Cyber Security Advocate
url: 'https://cairbre.co.uk'

#change it according to your repository name
# disabling since we are using a custom domain
#baseurl: '/online-cv'

description: >-
  Cairbre Smith is an IT Enterprise Architect and Cyber Security Advocate,
  working across technical, solution and enterprise architecture in UK
  enterprise and government environments.
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: ceramic # blue turquoise green berry orange ceramic
chrome_mobile_color: #use hex colors (ex:#1976d2) or leave empty if you don't want a color for chrome mobile searchbar

# Tracker
analytics: G-PJBQH0KPZB

# SEO / discovery (jekyll-seo-tag + jekyll-sitemap, both bundled with the github-pages gem)
twitter:
  username: cairbresmith
  card: summary
author:
  name: Cairbre Smith
  twitter: cairbresmith

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://nothislink
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
